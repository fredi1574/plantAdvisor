<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="main-leaf-vein">
      <rect width="512" height="512" fill="white" />
      <path
        d="M 264 224 Q 294 190 332 152"
        fill="none"
        stroke="black"
        stroke-width="10"
        stroke-linecap="round"
      />
    </mask>
    <mask id="left-leaf-vein">
      <rect width="512" height="512" fill="white" />
      <path
        d="M 248 244 Q 220 216 186 184"
        fill="none"
        stroke="black"
        stroke-width="9"
        stroke-linecap="round"
      />
    </mask>
  </defs>

  <g transform="translate(-4, 0)">
    <!-- Central stem -->
    <path
      d="M 256 292 L 256 238"
      fill="none"
      stroke="#2D5A3C"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Left companion leaf -->
    <path
      d="M 256 252 C 256 196 214 156 154 152 C 156 212 200 250 256 252 Z"
      fill="#4E7A5B"
