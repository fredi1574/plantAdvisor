    />

    <!-- Right primary leaf -->
    <path
      d="M 256 232 C 254 166 298 118 368 114 C 366 184 318 230 256 232 Z"
      fill="#2D5A3C"
      mask="url(#main-leaf-vein)"
    />

    <!-- Terracotta pot rim -->
    <rect
      x="172"
      y="290"
      width="168"
      height="28"
      rx="12"
      fill="#C86D51"
    />

    <!-- Terracotta pot body -->
    <path
      d="M 186 326 L 326 326 L 310 396 C 308 406 300 412 290 412 L 222 412 C 212 412 204 406 202 396 Z"
      fill="#C86D51"
    />
  </g>
</svg>
